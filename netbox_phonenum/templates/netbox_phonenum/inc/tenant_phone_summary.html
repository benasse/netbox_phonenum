<div class="card">
    <h5 class="card-header">Phone Number Resources</h5>
    <table class="table table-hover attr-table">
        <tr>
            <th scope="row">Pools</th>
            <td class="text-end">
                <a href="{% url 'plugins:netbox_phonenum:pool_list' %}?tenant={{ object.pk }}">
                    <span class="badge text-bg-primary">{{ pool_count }}</span>
                </a>
            </td>
        </tr>
        <tr>
            <th scope="row">Pool Capacity</th>
            <td class="text-end">
                <span class="badge text-bg-primary">{{ pool_capacity }}</span>
            </td>
        </tr>
        <tr>
            <th scope="row">Numbers</th>
            <td class="text-end">
                <span class="badge text-bg-primary">{{ number_count }}</span>
            </td>
        </tr>
        <tr>
            <th scope="row">Standalone Numbers</th>
            <td class="text-end">
                <a href="{% url 'plugins:netbox_phonenum:number_list' %}?tenant={{ object.pk }}&pool_id=null">
                    <span class="badge text-bg-primary">{{ standalone_number_count }}</span>
                </a>
            </td>
        </tr>
        <tr>
            <th scope="row">Voice Circuits</th>
            <td class="text-end">
                <a href="{% url 'plugins:netbox_phonenum:voicecircuit_list' %}?tenant={{ object.pk }}">
                    <span class="badge text-bg-primary">{{ voice_circuit_count }}</span>
                </a>
            </td>
        </tr>
    </table>
</div>
